    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "python-dotenv>=1.2.1",
    "rioxarray>=0.21.0",
    "scikit-learn>=1.4",
    "torchgeo>=0.9",
    "typer>=0.21.1",
    "wandb>=0.24.1",
    "xee>=0.0.24",
    "zarr>=3.1.5",
    "lightgbm>=4.6.0",
    "xgboost>=3.2.0",
    "faiss-cpu>=1.7",
    "osm-rasterizer>=0.1.1",
    "seaborn>=0.13.2",
    "geojson>=3.2.0",
    "nbformat>=5.10.4",
    "mgrs>=1.5.4",
    "plotly>=6.7.0",
    "umap-learn>=0.5.12",
